name: release

on:
  push:
    tags: ["v*"]
  # 手动触发只构建并打包，不发布 —— 用来在不动 tag 的情况下验证这条流水线。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # hub 的「从 GitHub 更新」比的是 release tag 与 theme.json 的 version，
      # 两者不等就会每次都提示有更新。tag 一旦推上去就既不能改也不能删，
      # 所以在发布之前拦住。
      - name: tag 必须等于 theme.json 的版本号
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=v$(node -p 'require("./theme.json").version')
          [ "$GITHUB_REF_NAME" = "$V" ] || { echo "::error::tag $GITHUB_REF_NAME, theme.json $V"; exit 1; }

      # release 说明取自 CHANGELOG.md 里对应的一节。先取一次，取不到就到此为止 ——
      # 与其发一个没有说明、事后又改不了的 release，不如在构建之前失败。
      - name: 从 CHANGELOG 取出本版本的说明
        run: |
          V=$(node -p 'require("./theme.json").version')
          node scripts/changelog.mjs "$V" -o release-notes.md
          node scripts/changelog.mjs "$V" --check

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # 包里是一个可直接安装的主题目录，不是源码快照：dist/ 与 theme.json 并排，
      # 正是 hub 从磁盘读主题时的布局。preview.png 放在主题目录里而不是 dist/ 里 ——
      # 它是面板的缩略图，不是主题要对外提供的文件。
      - run: npm run package
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      - name: 检查包内容
        run: |
          gzip -t theme.tar.gz
          # 两个图标文件少了哪个都不会报错，只会静默退化成没有图标 —— 卡在这里。
          for f in theme.json preview.png dist/index.html dist/favicon.svg dist/apple-touch-icon.png; do
            tar tzf theme.tar.gz | grep -qx "$f" || { echo "::error::包里没有 $f"; exit 1; }
          done

      # 手动触发时只留下产物，供下载检查。
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: theme
          path: |
            theme.tar.gz
            theme.tar.gz.sha256
          retention-days: 30

      # 不写 --title：gh 默认拿 tag 名当标题，也就是「v0.0.1」，不再多一层主题名前缀。
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" \
            theme.tar.gz theme.tar.gz.sha256 \
            --notes-file release-notes.md \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
